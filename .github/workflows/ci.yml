name: CI

# temperloop's CI: a single job named `checks` (the required status
# check for branch protection), run on ubuntu-latest ONLY. macOS coverage
# has MOVED OFF the merge gate to a nightly run —
# .github/workflows/nightly-macos.yml — so this workflow gates merges and
# that one catches BSD-dialect regressions within a day.
# The job runs ONE command, scripts/quality-gates.sh — the single source of
# truth for the whole static gate set (board/build/install/hooks suites,
# Capture/Backstop + PR-body-lint registries, the kernel manifest/denylist/gitleaks
# scrub checks, and a whole-tree shellcheck). Add or change a gate THERE, not
# here.
#
# WHY UBUNTU-ONLY PRE-MERGE (temperloop#963) — a deliberate speed-for-
# coverage trade, not a claim that macOS was redundant. The macOS leg was
# the slow one (~6m46s–9m37s vs ubuntu's ~4m50s) and it ran TWICE per PR,
# once on `pull_request` and once on `merge_group`, so it set both
# PR-ready latency and merge latency.
#
# WHAT THIS COSTS, stated honestly: this repo has REAL BSD/macOS dialect
# hazards (no `asort` in BSD awk, GNU `sed` `:label`/`t` loops rejected,
# no `date -d`), and the pinned-shellcheck provisioning below was added
# (temperloop#567) precisely so a local green implies a CI green. With
# macOS off the gate, a BSD-dialect regression CAN now reach `main`. The
# nightly macOS run is the mitigation: it converts "never caught" into
# "caught within a day", not into "caught at the gate".
#
# KEEP THE MATRIX. `os: [ubuntu-latest]` is a SINGLE-ENTRY matrix on
# purpose: a matrix job's status context is `checks (ubuntu-latest)`,
# which is the exact context name branch protection requires; deleting
# the matrix would rename the context to plain `checks` and the required
# check would then never report. Do not "simplify" it away.
#
# SINCE temperloop#2165 THE MATRIX IS A CONTEXT-NAME TOKEN, NOT A RUNNER
# SELECTOR. `runs-on` is now resolved dynamically by the `runner-preflight`
# job below (the self-hosted ci-mini Linux runner when it is online and
# idle, hosted `ubuntu-latest` otherwise) and no longer reads `matrix.os`.
# That separation is the entire point: GitHub derives a matrix job's
# status-check name from the JOB ID plus its `strategy.matrix` VALUES —
# `runs-on` contributes nothing to it — so the reported context stays
# byte-identical `checks (ubuntu-latest)` on BOTH arms, and branch
# protection / the merge queue are untouched.
#
# CONSEQUENCE, STATED PLAINLY: the literal `ubuntu-latest` in the matrix
# below is now load-bearing ONLY as that context string. Changing it
# renames the required check and bricks every future PR — the required
# check would never report, so nothing could leave the merge queue. The
# SEPARATE literal `"ubuntu-latest"` in runner-preflight's `HOSTED` is the
# actual fallback runner. They must agree by convention (the fallback arm
# should land on the image the context name claims), but they are two
# different knobs: editing one does not move the other.
#
# WHICH GATES RUN, BY EVENT (temperloop#1024) — the workflow itself is
# unchanged here; the split lives inside scripts/quality-gates.sh, so the
# job name, the matrix, the required context `checks (ubuntu-latest)`, and
# the single `run:` step below are all exactly as they were:
#
#   pull_request  DIFF-SCOPED. Only the gates the PR's changed paths can
#                 affect, per workflows/scripts/config/gate-paths.tsv. This
#                 is where the ~5.5 min flat cost was being paid on every
#                 PR (measured 2026-08-02 across the last 20 runs) for a
#                 diff that usually touches one directory.
#   merge_group   FULL SET. This is the run that actually gates `main` —
#                 nothing merges without it — so it is deliberately NOT
#                 scoped. Whole-set coverage of the default branch is
#                 therefore identical to before diff-scoping existed.
#   push: main    FULL SET (belt and braces on the merged result).
#   nightly       FULL SET on macos-latest (nightly-macos.yml).
#
# So a narrowing bug can, at worst, let a PR go green early — it can never
# let an unproven commit reach `main`, because the merge queue re-runs
# everything. The selector additionally defaults to the FULL set on any
# unrecognised changed path, unresolvable base, or unusable map; see
# workflows/scripts/lib/gate-selection.sh's header for the four defenses,
# and workflows/scripts/config/check-gate-paths.sh (itself a gate) for the
# map's completeness + reachability validation.
#
# Nothing new is passed in for this: GitHub Actions already exports
# GITHUB_EVENT_NAME, and the base SHA is REUSED from the LEAK_GUARD_BASE
# export below rather than derived a second way.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

jobs:
  # ── Self-hosted runner preflight (temperloop#2165) ───────────────────────
  # Decide WHERE `checks` runs. The gate set is compute-bound and the hosted
  # runner a private repo gets is 2 vCPU; the shared ci-mini Linux VM is a
  # dedicated multi-core persistent runner (stood up by foundation#1927). So
  # this job probes that runner and emits a dynamic `runs-on` for `checks`:
  #
  #   online AND idle ci-mini → ["self-hosted","linux","ci-mini"]
  #   anything else           → "ubuntu-latest"   (never blocks the queue)
  #
  # "AND idle": there is ONE runner, so a second concurrent run routed to it
  # would queue behind the first — overflow goes hosted instead (`busy` is on
  # the runners API). Two preflights racing within a few seconds can both see
  # idle; the loser waits one job, bounded by `timeout-minutes` on `checks`.
  #
  # PROBE = THE SAME LABEL SET `runs-on` DEMANDS, deliberately. If the probe
  # accepted a runner carrying only `ci-mini` while `runs-on` also demands
  # `linux`, the scheduler would never match it and the job would hang until
  # its timeout — holding the merge queue. Requiring the identical triple
  # makes probe and scheduler agree by construction. Comparison is
  # case-folded because Actions' own label matching is case-insensitive
  # (a runner self-registers `Linux`, not `linux`).
  #
  # BOTH SCOPES ARE PROBED (org, then repo) and the counts are summed. The
  # ci-mini runner is org-level, so `/repos/{repo}/actions/runners` — which
  # lists REPO-level runners only — would report zero for it and this repo
  # would silently never use the runner at all. The repo endpoint is kept as
  # well so a repo-level registration works without editing this file.
  #
  # GITHUB_TOKEN cannot list self-hosted runners (admin-only, not grantable
  # to the workflow token), so detection uses the fine-grained PAT secret
  # RUNNER_PAT. THAT SECRET IS NOT CONFIGURED ON THIS REPO TODAY, which is
  # the point of the fail-safe: a missing/empty PAT, an API error, a 403 on
  # either scope, or a fork PR (no secrets exposed) ALL fall through to
  # hosted. Worst case is "runs on ubuntu-latest exactly as before" — never
  # red, never hung. A bare kernel checkout with no runner and no secret
  # therefore still gets a working `checks` run; the self-hosted path is an
  # optimisation, never a requirement.
  #
  # THE REQUIRED STATUS CONTEXT IS UNAFFECTED: only `runs-on` is dynamic.
  # See "SINCE temperloop#2165" in the header above for why.
  runner-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
    steps:
      - id: pick
        env:
          RUNNER_PAT: ${{ secrets.RUNNER_PAT }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          HOSTED='"ubuntu-latest"'
          SELF='["self-hosted","linux","ci-mini"]'
          if [ -z "${RUNNER_PAT:-}" ]; then
            echo "No RUNNER_PAT secret (absent, or a fork PR) — routing checks to hosted ubuntu-latest."
            echo "runs_on=$HOSTED" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Count runners carrying EVERY label in $SELF that are online AND idle.
          # Any curl/jq failure (403, 404, network, malformed body) yields "" and
          # is treated as zero by the arithmetic below.
          count_idle() {
            curl -sf --max-time 20 \
              -H "Authorization: Bearer $RUNNER_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/$1/actions/runners?per_page=100" \
              | jq -r --argjson want "$SELF" \
                  '[.runners[]? | select(.status=="online" and .busy==false)
                     | select(($want - [.labels[].name | ascii_downcase]) | length == 0)]
                   | length' 2>/dev/null
          }
          org_n=$(count_idle "orgs/$GH_OWNER"); org_n=${org_n:-0}
          repo_n=$(count_idle "repos/$GH_REPOSITORY"); repo_n=${repo_n:-0}
          case "$org_n$repo_n" in *[!0-9]*) org_n=0; repo_n=0 ;; esac
          idle=$(( org_n + repo_n ))
          if [ "$idle" -ge 1 ]; then
            echo "ci-mini is online and idle (org=$org_n repo=$repo_n) — routing checks to the self-hosted runner."
            echo "runs_on=$SELF" >> "$GITHUB_OUTPUT"
          else
            echo "No online+idle ci-mini runner (org=$org_n repo=$repo_n) — routing checks to hosted ubuntu-latest."
            echo "runs_on=$HOSTED" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: [runner-preflight]
    # Dynamic runner (temperloop#2165): the shared ci-mini Linux VM when it is
    # online and idle, else hosted ubuntu-latest — resolved by runner-preflight
    # above. The job body is IDENTICAL on both targets; only the machine
    # differs. `matrix.os` is deliberately NOT read here — see the header.
    runs-on: ${{ fromJSON(needs.runner-preflight.outputs.runs_on) }}
    # Hard backstop for a wedged self-hosted job: without it a hung gate runs
    # to GitHub's 6-hour default and holds the merge queue. The full set is
    # ~5-6 min on the hosted 2 vCPU image today; 30 min is comfortably above
    # it and well below the default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Single-entry matrix, retained deliberately — see "KEEP THE
        # MATRIX" in the header comment above. This value is the required
        # status-check CONTEXT NAME (`checks (ubuntu-latest)`), not a runner
        # selector; the runner comes from `runs-on` above. Renaming it makes
        # the required check stop reporting and blocks every future merge.
        os: [ubuntu-latest]
    # The diff-scoped PR leak guard (make test-pr-leak-guard, run inside
    # quality-gates.sh) needs the PR's base commit to diff the added lines
    # against. Hand it the base SHA from the event payload — pull_request and
    # merge_group both carry one, so the guard's live scan runs in BOTH gating
    # events; on push:main it stays empty and the guard skips the live scan.
    #
    # The CHANGELOG [Unreleased] gate (workflows/scripts/check-changelog-entry.sh,
    # also run inside quality-gates.sh — temperloop#960) needs three things from
    # the event payload: the same base SHA, plus the two channels an author can
    # record an EXPLICIT opt-out on — the PR's labels and its body. Both exist
    # only on the `pull_request` event, which is exactly why that gate enforces
    # on `pull_request` only and prints a legible skip on merge_group/push (an
    # author's recorded opt-out would otherwise be invisible in the merge queue
    # and a legitimately-exempt PR would fail there after passing on the PR).
    # Passing the body through `env:` rather than interpolating it into a `run:`
    # block is deliberate — it is untrusted user input and must never reach a
    # shell as script text.
    env:
      LEAK_GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
      CHANGELOG_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
      CHANGELOG_GATE_PR_BODY: ${{ github.event.pull_request.body }}
      CHANGELOG_GATE_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      # fetch-depth: 0 so the base commit above is present in the local history
      # for `git diff <base>...HEAD` (a shallow depth-1 checkout has no base).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # No shellcheck install step: scripts/quality-gates.sh -> `make shellcheck`
      # provisions a PINNED shellcheck (scripts/ensure-shellcheck.sh), so the
      # version is identical to what runs locally (temperloop#567 — a local
      # green must guarantee a CI green on this gate). This bypasses the ubuntu
      # runner's pre-installed apt shellcheck entirely, and the nightly macOS
      # workflow provisions the same pin so both legs stay version-identical.
      - run: bash scripts/quality-gates.sh
