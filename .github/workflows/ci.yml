name: CI

# temperloop's CI: a single job named `checks` (the required status
# check for branch protection), run on ubuntu-latest ONLY. macOS coverage
# has MOVED OFF the merge gate to a nightly run —
# .github/workflows/nightly-macos.yml — so this workflow gates merges and
# that one catches BSD-dialect regressions within a day.
# The job runs ONE command, scripts/quality-gates.sh — the single source of
# truth for the whole static gate set (board/build/install/hooks suites,
# Capture/Backstop + PR-body-lint registries, the kernel manifest/denylist/gitleaks
# scrub checks, and a whole-tree shellcheck). Add or change a gate THERE, not
# here.
#
# WHY UBUNTU-ONLY PRE-MERGE (temperloop#963) — a deliberate speed-for-
# coverage trade, not a claim that macOS was redundant. The macOS leg was
# the slow one (~6m46s–9m37s vs ubuntu's ~4m50s) and it ran TWICE per PR,
# once on `pull_request` and once on `merge_group`, so it set both
# PR-ready latency and merge latency.
#
# WHAT THIS COSTS, stated honestly: this repo has REAL BSD/macOS dialect
# hazards (no `asort` in BSD awk, GNU `sed` `:label`/`t` loops rejected,
# no `date -d`), and the pinned-shellcheck provisioning below was added
# (temperloop#567) precisely so a local green implies a CI green. With
# macOS off the gate, a BSD-dialect regression CAN now reach `main`. The
# nightly macOS run is the mitigation: it converts "never caught" into
# "caught within a day", not into "caught at the gate".
#
# KEEP THE MATRIX. `os: [ubuntu-latest]` is a SINGLE-ENTRY matrix on
# purpose: a matrix job's status context is `checks (ubuntu-latest)`,
# which is the exact context name branch protection requires; deleting
# the matrix would rename the context to plain `checks` and the required
# check would then never report. Do not "simplify" it away. Since
# temperloop#2165 the matrix value names the CONTEXT only — where the job
# actually runs is decided by `runner-preflight` below (a status context
# takes its name from the job name plus the matrix values, never from
# `runs-on`, so the context is unchanged whichever machine picks it up).
#
# WHERE `checks` RUNS (temperloop#2165) — the mini's Linux CI VM when its
# runner is online and idle, hosted `ubuntu-latest` otherwise. The
# `runner-preflight` job (hosted, ~10 s) lists this repo's self-hosted
# runners through the `RUNNER_PAT` secret (a fine-grained PAT with
# Administration: Read on this repo only — the workflow's own GITHUB_TOKEN
# cannot list runners) and emits the `runs-on` value `checks` consumes.
# Without the secret, or with the VM stopped, wedged or already busy,
# every run routes hosted and nothing else changes — the self-hosted path
# is an accelerator, never a dependency. That holds at the JOB-GRAPH level
# too, since temperloop#2211: `checks` carries `if: ${{ !cancelled() }}` and
# a hosted `runs-on` fallback, so a preflight that fails or skips outright
# still leaves the required context published from hosted ubuntu-latest. Measured on foundation's
# identical arrangement: 250 gates in 324 s on the VM (4 workers) against
# 1247 s hosted (2 workers). The VM itself is owned by foundation's
# `infra/ci-runner/` (provisioning, autostart, uninstall); this workflow
# owns only the routing. `checks` carries `timeout-minutes: 30` so a
# wedged self-hosted job can never hold the merge queue for GitHub's
# 6-hour default.
#
# WHICH GATES RUN, BY EVENT (temperloop#1024) — the workflow itself is
# unchanged here; the split lives inside scripts/quality-gates.sh, so the
# job name, the matrix, the required context `checks (ubuntu-latest)`, and
# the single `run:` step below are all exactly as they were:
#
#   pull_request  DIFF-SCOPED. Only the gates the PR's changed paths can
#                 affect, per workflows/scripts/config/gate-paths.tsv. This
#                 is where the ~5.5 min flat cost was being paid on every
#                 PR (measured 2026-08-02 across the last 20 runs) for a
#                 diff that usually touches one directory.
#   merge_group   FULL SET. This is the run that actually gates `main` —
#                 nothing merges without it — so it is deliberately NOT
#                 scoped. Whole-set coverage of the default branch is
#                 therefore identical to before diff-scoping existed.
#   push: main    FULL SET (belt and braces on the merged result).
#   nightly       FULL SET on macos-latest (nightly-macos.yml).
#
# So a narrowing bug can, at worst, let a PR go green early — it can never
# let an unproven commit reach `main`, because the merge queue re-runs
# everything. The selector additionally defaults to the FULL set on any
# unrecognised changed path, unresolvable base, or unusable map; see
# workflows/scripts/lib/gate-selection.sh's header for the four defenses,
# and workflows/scripts/config/check-gate-paths.sh (itself a gate) for the
# map's completeness + reachability validation.
#
# Nothing new is passed in for this: GitHub Actions already exports
# GITHUB_EVENT_NAME, and the base SHA is REUSED from the LEAK_GUARD_BASE
# export below rather than derived a second way.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

jobs:
  runner-preflight:
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
    steps:
      - id: pick
        env:
          RUNNER_PAT: ${{ secrets.RUNNER_PAT }}
        run: |
          set -uo pipefail
          HOSTED='"ubuntu-latest"'
          SELF='["self-hosted","ci-mini"]'
          if [ -z "${RUNNER_PAT:-}" ]; then
            echo "No RUNNER_PAT secret — routing checks to hosted ubuntu-latest."
            echo "runs_on=$HOSTED" >> "$GITHUB_OUTPUT"; exit 0
          fi
          runners() {  # <owner/repo> → that repo's runner list (JSON), or non-zero
            curl -sf \
              -H "Authorization: Bearer $RUNNER_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$1/actions/runners?per_page=100"
          }
          # 1. This repo's `ci-mini` runner must be registered, online AND idle.
          idle=$(runners "${{ github.repository }}" \
            | jq -r '[.runners[]? | select(.status=="online" and .busy==false)
                       | select([.labels[].name] | index("ci-mini"))] | length') || idle=""
          if ! [ "${idle:-0}" -ge 1 ] 2>/dev/null; then
            echo "No idle ci-mini runner (count='${idle:-}') — routing checks to hosted ubuntu-latest."
            echo "runs_on=$HOSTED" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 2. ONE LANE across the VM (foundation#1941): every adopter's runner is a
          #    process in the same 6-vCPU VM, and GitHub's `busy` is per runner, so
          #    a sibling repo's running job must send this one hosted — measured
          #    overlap roughly triples per-gate time. A sibling the PAT cannot see
          #    (403, network) is logged and treated as idle, so a narrower PAT
          #    degrades to the per-repo check above, never to always-hosted.
          busy_elsewhere=""
          for sib in Towheads/foundation Towheads/temperloop Towheads/stageFind Towheads/subsetwiki; do
            [ "$sib" = "${{ github.repository }}" ] && continue
            n=$(runners "$sib" | jq -r '[.runners[]? | select(.busy==true)
                                          | select([.labels[].name] | index("ci-mini"))] | length') || n=""
            case "$n" in
              '' | *[!0-9]*) echo "  $sib: runners not visible to RUNNER_PAT — assumed idle"; continue ;;
            esac
            [ "$n" -ge 1 ] && busy_elsewhere="$busy_elsewhere $sib"
          done
          if [ -n "$busy_elsewhere" ]; then
            echo "VM lane busy (${busy_elsewhere# } has a running ci-mini job) — routing checks to hosted ubuntu-latest."
            echo "runs_on=$HOSTED" >> "$GITHUB_OUTPUT"
          else
            echo "Self-hosted runner ci-mini is online and idle, VM lane free — routing checks to it."
            echo "runs_on=$SELF" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: [runner-preflight]
    # JOB-GRAPH GUARD (temperloop#2211). `needs:` alone makes the router a
    # DEPENDENCY of the required context: a `needs` job that fails is not
    # propagated as a failure, it SKIPS the dependent job — and a skipped job
    # never publishes `checks (ubuntu-latest)`, the repo's only required
    # context. The preflight's own script is fail-open on every path it
    # controls, but the job can still die outside the script (runner
    # allocation, an expression-evaluation error, an Actions incident), and
    # the accelerator would then have become a dependency after all.
    #
    # `!cancelled()` rather than `always()`, deliberately: both restore the
    # job past a failed/skipped `needs`, but `always()` ALSO overrides
    # cancellation, so a cancelled workflow run would keep burning a runner
    # (and, on the self-hosted VM, hold the single lane) until the gate set
    # finished. `!cancelled()` is GitHub's own recommendation for exactly this
    # case: run on success and on failure, stop on cancel.
    if: ${{ !cancelled() }}
    # Dynamic runner (temperloop#2165): the mini's Linux VM when online + idle,
    # else hosted ubuntu-latest — resolved by runner-preflight above. The job
    # body is identical on both targets; only the machine differs. The matrix
    # below still names the required context — see the header.
    #
    # The `||` fallback is the other half of the guard above: a preflight that
    # failed or skipped wrote no output, so `needs.…outputs.runs_on` is the
    # EMPTY STRING and a bare `fromJSON('')` errors the job out — turning the
    # required check red on every PR instead of just skipping it. The default
    # literal is therefore valid JSON *including its quotes*: single-quoted
    # shell-level string CONTAINING the double quotes fromJSON needs.
    runs-on: ${{ fromJSON(needs.runner-preflight.outputs.runs_on || '"ubuntu-latest"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Single-entry matrix, retained deliberately — see "KEEP THE
        # MATRIX" in the header comment above.
        os: [ubuntu-latest]
    # The diff-scoped PR leak guard (make test-pr-leak-guard, run inside
    # quality-gates.sh) needs the PR's base commit to diff the added lines
    # against. Hand it the base SHA from the event payload — pull_request and
    # merge_group both carry one, so the guard's live scan runs in BOTH gating
    # events; on push:main it stays empty and the guard skips the live scan.
    #
    # The CHANGELOG [Unreleased] gate (workflows/scripts/check-changelog-entry.sh,
    # also run inside quality-gates.sh — temperloop#960) needs three things from
    # the event payload: the same base SHA, plus the two channels an author can
    # record an EXPLICIT opt-out on — the PR's labels and its body. Both exist
    # only on the `pull_request` event, which is exactly why that gate enforces
    # on `pull_request` only and prints a legible skip on merge_group/push (an
    # author's recorded opt-out would otherwise be invisible in the merge queue
    # and a legitimately-exempt PR would fail there after passing on the PR).
    # Passing the body through `env:` rather than interpolating it into a `run:`
    # block is deliberate — it is untrusted user input and must never reach a
    # shell as script text.
    env:
      LEAK_GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
      CHANGELOG_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
      CHANGELOG_GATE_PR_BODY: ${{ github.event.pull_request.body }}
      CHANGELOG_GATE_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      # fetch-depth: 0 so the base commit above is present in the local history
      # for `git diff <base>...HEAD` (a shallow depth-1 checkout has no base).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # No shellcheck install step: scripts/quality-gates.sh -> `make shellcheck`
      # provisions a PINNED shellcheck (scripts/ensure-shellcheck.sh), so the
      # version is identical to what runs locally (temperloop#567 — a local
      # green must guarantee a CI green on this gate). The ubuntu runner's
      # pre-installed apt shellcheck is ignored unless it reports exactly the
      # pin (temperloop#2198 — on a self-hosted runner a natively built copy of
      # the pinned version on PATH is used instead of the release download,
      # which is ~5x slower on Linux/aarch64), and the nightly macOS workflow
      # provisions the same pin so both legs stay version-identical.
      - run: bash scripts/quality-gates.sh
